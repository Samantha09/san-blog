<script>
(function() {
    const cards = document.querySelectorAll('.tool-card');
    const hotTagsContainer = document.getElementById('hot-tags');
    const filterStatus = document.getElementById('filter-status');
    const filterTagName = document.getElementById('filter-tag-name');
    const btnAll = document.getElementById('btn-all');
    const btnSearch = document.getElementById('btn-search');
    const searchBox = document.getElementById('search-box');
    const searchInput = document.getElementById('search-input');
    const noTools = document.getElementById('no-tools');

    
    const tagCounts = {};
    cards.forEach(card => {
        card.querySelectorAll('.tool-tag').forEach(tag => {
            const name = tag.dataset.tag;
            tagCounts[name] = (tagCounts[name] || 0) + 1;
        });
    });

    
    const sortedTags = Object.entries(tagCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .map(([name]) => name);

    
    sortedTags.forEach(tag => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'hot-tag';
        a.textContent = tag;
        a.dataset.tag = tag;
        a.addEventListener('click', function(e) {
            e.preventDefault();
            filterByTag(tag);
        });
        hotTagsContainer.appendChild(a);
    });

    
    function filterByTag(tag) {
        console.log('[filterByTag]', tag);
        let visibleCount = 0;
        cards.forEach(card => {
            const cardTags = card.dataset.tags.split(',');
            if (cardTags.includes(tag)) {
                card.style.display = '';
                card.classList.remove('tool-hidden');
                visibleCount++;
            } else {
                card.style.display = 'none';
                card.classList.add('tool-hidden');
            }
        });

        updateFilterUI(tag, visibleCount);
    }

    
    function filterBySearch(keyword) {
        const kw = keyword.toLowerCase().trim();
        if (!kw) {
            showAll();
            return;
        }

        let visibleCount = 0;
        cards.forEach(card => {
            const name = card.querySelector('.tool-title').textContent.toLowerCase();
            const desc = card.querySelector('.tool-desc').textContent.toLowerCase();
            const tags = card.dataset.tags.toLowerCase();

            if (name.includes(kw) || desc.includes(kw) || tags.includes(kw)) {
                card.style.display = '';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        updateFilterUI('搜索: ' + keyword, visibleCount);
    }

    
    function updateFilterUI(label, visibleCount) {
        
        document.querySelectorAll('.hot-tag').forEach(t => {
            t.classList.toggle('active', t.dataset.tag === label);
        });
        btnAll.classList.remove('active');

        
        filterTagName.textContent = label;
        filterStatus.style.display = 'flex';

        
        noTools.style.display = visibleCount ? 'none' : 'block';
    }

    
    function showAll() {
        cards.forEach(card => {
            card.style.display = '';
            card.classList.remove('tool-hidden');
        });
        document.querySelectorAll('.hot-tag').forEach(t => t.classList.remove('active'));
        btnAll.classList.add('active');
        filterStatus.style.display = 'none';
        noTools.style.display = 'none';
    }

    
    btnAll.addEventListener('click', showAll);

    btnSearch.addEventListener('click', function() {
        const isVisible = searchBox.style.display !== 'none';
        searchBox.style.display = isVisible ? 'none' : 'block';
        if (!isVisible) {
            searchInput.focus();
        }
    });

    searchInput.addEventListener('input', function() {
        filterBySearch(this.value);
    });

    document.getElementById('filter-clear').addEventListener('click', showAll);

    
    document.querySelectorAll('.tool-tag').forEach(tag => {
        tag.addEventListener('click', function() {
            filterByTag(this.dataset.tag);
        });
        tag.style.cursor = 'pointer';
    });
})();
</script>

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
<script>
    document.querySelectorAll('pre > code').forEach((codeblock) => {
        const container = codeblock.parentNode.parentNode;

        const copybutton = document.createElement('button');
        copybutton.classList.add('copy-code');
        copybutton.innerHTML = 'copy';

        function copyingDone() {
            copybutton.innerHTML = 'copied!';
            setTimeout(() => {
                copybutton.innerHTML = 'copy';
            }, 2000);
        }

        copybutton.addEventListener('click', (cb) => {
            if ('clipboard' in navigator) {
                navigator.clipboard.writeText(codeblock.textContent);
                copyingDone();
                return;
            }

            const range = document.createRange();
            range.selectNodeContents(codeblock);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            try {
                document.execCommand('copy');
                copyingDone();
            } catch (e) { };
            selection.removeRange(range);
        });

        if (container.classList.contains("highlight")) {
            container.appendChild(copybutton);

        } else if (codeblock.parentNode.parentNode.parentNode.parentNode.parentNode.nodeName == "TABLE") {
            
            codeblock.parentNode.parentNode.parentNode.parentNode.parentNode.appendChild(copybutton);

    });
