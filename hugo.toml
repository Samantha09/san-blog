baseURL = 'https://Samantha09.github.io/san-blog'
languageCode = 'zh-cn'
title = 'Samantha09的博客'
theme = 'PaperMod'

[params]
  author = 'Samantha09'
  description = '记录学习与生活'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "Hi there 👋"
    Content = "欢迎来到 Samantha09 的博客，记录技术学习与生活点滴。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Samantha09"

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 10
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 40

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'
